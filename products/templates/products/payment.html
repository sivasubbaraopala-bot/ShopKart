
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart - Payment</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        .box {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 10px #ddd;
        }

        button {
            background: #2874f0;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 17px;
            border-radius: 5px;
            cursor: pointer;
        }

        .amount {
            font-size: 25px;
            font-weight: bold;
            margin: 25px 0;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>ShopKart</h1>

    <h2>Complete Your Payment</h2>

    <p>Order Number: {{ order.id }}</p>

    <div class="amount">
        ₹{{ order.total_amount }}
    </div>

    <button id="pay-button">
        Pay Now
    </button>

    <p id="payment-message"></p>

    <form
        id="payment-verification-form"
        method="POST"
        action="{% url 'verify_payment' order.id %}"
        style="display:none;"
    >
        {% csrf_token %}

        <input
            type="hidden"
            name="razorpay_payment_id"
            id="payment_id"
        >

        <input
            type="hidden"
            name="razorpay_order_id"
            id="payment_order_id"
        >

        <input
            type="hidden"
            name="razorpay_signature"
            id="payment_signature"
        >
    </form>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    const options = {
        key: "{{ razorpay_key_id|escapejs }}",

        amount: "{{ amount_paise }}",

        currency: "INR",

        name: "ShopKart",

        description: "ShopKart Order Payment",

        order_id: "{{ order.razorpay_order_id|escapejs }}",

        handler: function (response) {

            document.getElementById("payment_id").value =
                response.razorpay_payment_id;

            document.getElementById("payment_order_id").value =
                response.razorpay_order_id;

            document.getElementById("payment_signature").value =
                response.razorpay_signature;

            document.getElementById(
                "payment-message"
            ).innerText = "Verifying payment. Please wait...";

            document.getElementById(
                "payment-verification-form"
            ).submit();
        },

        modal: {
            ondismiss: function () {
                document.getElementById(
                    "payment-message"
                ).innerText = "Payment window closed. You can try again.";
            }
        },

        theme: {
            color: "#2874f0"
        }
    };

    const razorpay = new Razorpay(options);

    document.getElementById("pay-button").onclick = function (event) {
        event.preventDefault();
        razorpay.open();
    };
</script>

</body>
</html>
